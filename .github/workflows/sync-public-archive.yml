name: OX500 public archive and living README sync

on:
  schedule:
    - cron: '07 7,19 * * *' # twice daily UTC; eventual sync after artistic releases
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_live_archive.py
      - tests/test_public_sync.py
      - .github/workflows/sync-public-archive.yml

permissions:
  contents: write

concurrency:
  group: ox500-public-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Validate public mirror
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sync_live_archive.py tests/test_public_sync.py
          python3 -m unittest discover -s tests -v

      - name: Read published OX500 archive and update public face
        run: python3 scripts/sync_live_archive.py

      - name: Commit only generated public documents
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- README.md data/archive.json data/agent-manifest.json data/activity.json)" ]; then
            echo "Public archive already synchronized."
            exit 0
          fi
          git config user.name "ox500-public-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/archive.json data/agent-manifest.json data/activity.json
          git commit -m "docs(ox500): sync living public front page and published archive [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
